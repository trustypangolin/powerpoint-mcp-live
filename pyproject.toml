[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerpoint-mcp-live"
version = "0.1.0"
description = "MCP server for Microsoft PowerPoint — live editing of presentations already open in PowerPoint via COM automation"
readme = "README.md"
keywords = ["mcp", "powerpoint", "pptx", "microsoft-powerpoint", "com-automation", "ai", "llm", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.8.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
]

[project.scripts]
powerpoint-mcp-live = "powerpoint_document_server.main:run_server"

[tool.hatch.build.targets.wheel]
only-include = [
    "powerpoint_document_server",
]
sources = ["."]
